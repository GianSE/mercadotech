name: Bronze CAGED

# Só a bronze do CAGED: baixa do FTP, converte pra parquet ZSTD-3, publica
# em bronze-caged. Sem tradução, sem filtro de TI.
#
# Padrão automático (sem input manual): ano atual e anterior só — rápido,
# cobre o caso comum (competência nova saindo todo mês). Se faltar algo
# mais antigo, dispare manualmente com --ano-inicio mais pra trás.

on:
  # Sem schedule próprio — quem agenda é o pipeline.yml orquestrador.
  workflow_dispatch:
    inputs:
      ano_inicio:
        description: "Ano inicial (vazio = ano atual - 1)"
      ano_fim:
        description: "Ano final (vazio = ano atual)"
      forcar:
        description: "Reingerir os anos pedidos mesmo que já estejam publicados"
        type: boolean
        default: false
      meses:
        description: "Só estes meses, separados por espaço (ex.: caged_old/2012/08 caged_ajustes/2010/10); ignora os anos e já força"
  workflow_call:
    inputs:
      ano_inicio:
        type: string
      ano_fim:
        type: string
      forcar:
        type: boolean
        default: false
      meses:
        type: string

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  verificar:
    runs-on: ubuntu-latest
    outputs:
      tem_novidade: ${{ steps.chk.outputs.tem_novidade }}
      anos: ${{ steps.chk.outputs.anos }}
    steps:
      - name: Recursos do runner (CPU, RAM, disco)
        run: |
          echo "--- CPU ---"; nproc --all
          echo "--- RAM ---"; free -h
          echo "--- Disco ---"; df -h /

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-actions.txt

      - id: chk
        working-directory: tasks-python/1-bronze
        run: |
          ANO_INICIO="${{ inputs.ano_inicio }}"
          ANO_FIM="${{ inputs.ano_fim }}"
          MESES="${{ inputs.meses }}"
          python bronze-caged.py --modo verificar --ano-inicio "${ANO_INICIO:-0}" --ano-fim "${ANO_FIM:-9999}" ${{ inputs.forcar && '--forcar' || '' }} ${MESES:+--meses $MESES}

  atualizar:
    needs: verificar
    if: needs.verificar.outputs.tem_novidade == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        item: ${{ fromJson(needs.verificar.outputs.anos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-actions.txt

      - name: Baixa ${{ matrix.item.tabela }} ${{ matrix.item.ano }}
        working-directory: tasks-python/1-bronze
        run: |
          MESES="${{ inputs.meses }}"
          python bronze-caged.py --modo processar --tabela ${{ matrix.item.tabela }} \
            --ano-inicio ${{ matrix.item.ano }} --ano-fim ${{ matrix.item.ano }} ${{ inputs.forcar && '--forcar' || '' }} ${MESES:+--meses $MESES}
